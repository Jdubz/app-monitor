# Nginx configuration for App Monitor
# Place in /etc/nginx/sites-available/app-monitor
# Enable with: sudo ln -s /etc/nginx/sites-available/app-monitor /etc/nginx/sites-enabled/

upstream app_monitor_backend {
    # This will be dynamically updated by deployment script
    server 127.0.0.1:5001;
    keepalive 32;
}

# Redirect HTTP to HTTPS (optional, configure as needed)
server {
    listen 80;
    server_name localhost;

    # For local development, you can serve directly on HTTP
    # For production, uncomment the redirect below:
    # return 301 https://$server_name$request_uri;

    # For local HTTP serving:
    location / {
        root /opt/app-monitor/current/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy
    location /api/ {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

