# App Monitor - Production Configuration
# Serves frontend and proxies API requests to backend

upstream app_monitor_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root directory for frontend static files
    root /opt/app-monitor/current/frontend/dist;
    index index.html;

    # Frontend - serve static files with fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching of HTML files to ensure users always get latest bundle references
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache static assets with versioned filenames (Vite generates hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Socket.IO endpoint - MUST come before /api/
    location /socket.io/ {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for WebSocket
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 75s;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # SSE endpoints - MUST come before /api/ for specificity
    # These endpoints stream real-time data and require special buffering settings
    location ~ ^/api/(sse/events|admin-bot/chat/stream) {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL for SSE: Disable all buffering
        proxy_buffering off;
        proxy_cache off;

        # Keep connection alive for streaming
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Long timeouts for persistent SSE connections
        proxy_read_timeout 86400s;  # 24 hours
        proxy_send_timeout 86400s;
        proxy_connect_timeout 75s;

        # Disable request/response size limits for streaming
        client_max_body_size 0;
        proxy_max_temp_file_size 0;
    }

    # API - proxy to backend
    location /api/ {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
