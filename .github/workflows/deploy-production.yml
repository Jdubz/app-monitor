name: Deploy to PRODUCTION

# ⚠️  PRODUCTION DEPLOYMENT WORKFLOW
#
# Purpose: Deploys to /opt/app-monitor (production environment) when code is pushed to main
#
# Environment Clarification:
# - DEV environment: /home/jdubz/Development/app-monitor (for local development/staging)
# - PROD environment: /opt/app-monitor (where the live application runs)
#
# This workflow:
# 1. Runs pre-deployment checks on GitHub-hosted runner
# 2. Deploys to /opt/app-monitor on self-hosted runner
# 3. Performs blue-green deployment with zero downtime
# 4. Rebuilds production frontend application in /opt/app-monitor
#
# Triggered on push to main branch or manual workflow dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY TO PRODUCTION" to confirm'
        required: true
        default: ''

# SECURITY: Prevent this workflow from running on pull requests or forks
# Self-hosted runners should NEVER run untrusted code from PRs

jobs:
  # Pre-deployment checks
  pre-deployment-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ ERROR: Can only deploy from main branch"
            exit 1
          fi

      - name: Confirm manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY TO PRODUCTION" ]; then
            echo "❌ ERROR: Deployment not confirmed"
            echo "   You must type 'DEPLOY TO PRODUCTION' to confirm"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test:backend

      - name: Run backend linter
        run: npm run lint -w backend

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

  # Production deployment
  deploy-production:
    name: Deploy to Production Server
    needs: pre-deployment-checks
    runs-on: self-hosted
    # SECURITY: Only run on main branch to prevent fork PRs from deploying
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://app-monitor.yourdomain.com

    steps:
      - name: Display deployment warning
        run: |
          echo "🏭 DEPLOYING TO PRODUCTION"
          echo "=========================="
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run deployment script
        run: |
          # Deploy to /opt/app-monitor (production environment)
          # This script handles:
          # - Blue-green deployment (ports 5001/5002)
          # - Building backend and frontend in /opt/app-monitor
          # - Zero-downtime service switching
          # Pass the GitHub workspace as source directory
          sudo /opt/app-monitor/scripts/deploy.sh "${{ github.workspace }}"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying services..."
          # Check which backend port is active (blue-green deployment)
          if sudo systemctl is-active --quiet app-monitor-backend@5001.service; then
            echo "✅ Backend running on port 5001"
          elif sudo systemctl is-active --quiet app-monitor-backend@5002.service; then
            echo "✅ Backend running on port 5002"
          else
            echo "❌ Backend service not running on either port"
            exit 1
          fi
          sudo systemctl is-active nginx
          echo "✅ All services running"

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          # Detect active backend port from running services
          if sudo systemctl is-active --quiet app-monitor-backend@5001.service; then
            ACTIVE_PORT=5001
          elif sudo systemctl is-active --quiet app-monitor-backend@5002.service; then
            ACTIVE_PORT=5002
          else
            echo "❌ No backend service running"
            exit 1
          fi

          echo "Checking backend health on port ${ACTIVE_PORT}..."
          timeout 30 bash -c "until curl -f http://localhost:${ACTIVE_PORT}/api/health; do sleep 2; done"

          # Check frontend (nginx on port 80)
          echo "Checking frontend health..."
          timeout 30 bash -c 'until curl -f http://localhost/; do sleep 2; done'

          echo "✅ Health checks passed"

  # Post-deployment notification
  notify-deployment:
    name: Notify Deployment Status
    needs: deploy-production
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "✅ PRODUCTION deployment successful"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

      - name: Deployment failure
        if: needs.deploy-production.result != 'success'
        run: |
          echo "❌ PRODUCTION deployment failed"
          echo "Check logs for details"
          exit 1
