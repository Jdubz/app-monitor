name: Deploy to PRODUCTION (Pull Agent)

# ⚠️  PRODUCTION DEPLOYMENT WORKFLOW
#
# Purpose: Deploys to /opt/app-monitor (production environment) when code is pushed to main
#
# Architecture: Pull-based deployment
# - GitHub Actions builds and packages the application
# - Creates a GitHub deployment with artifact metadata
# - Pull agent on production server detects the deployment
# - Pull agent downloads artifact and runs local deployment script
#
# Benefits over self-hosted runner:
# - No persistent runner with elevated permissions
# - No exposure of production environment to GitHub Actions
# - Deployment credentials managed by 1Password service account
# - Deployment runs locally with proper isolation
#
# Environment Clarification:
# - DEV environment: /home/jdubz/Development/app-monitor (for local development/staging)
# - PROD environment: /opt/app-monitor (where the live application runs)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY TO PRODUCTION" to confirm'
        required: true
        default: ''

# SECURITY: Prevent this workflow from running on pull requests or forks
# Only trusted main branch code should create production deployments

jobs:
  # Pre-deployment checks and build
  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha: ${{ steps.package.outputs.sha256 }}
      deployment-id: ${{ steps.deploy.outputs.deployment_id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ ERROR: Can only deploy from main branch"
            exit 1
          fi

      - name: Confirm manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          CONFIRMATION="${{ github.event.inputs.confirm }}"
          REQUIRED="DEPLOY TO PRODUCTION"
          
          if [ "$CONFIRMATION" != "$REQUIRED" ]; then
            echo "❌ ERROR: Deployment not confirmed"
            echo ""
            echo "   Expected: '$REQUIRED'"
            echo "   Received: '$CONFIRMATION'"
            echo ""
            echo "   You must type exactly 'DEPLOY TO PRODUCTION' to confirm"
            echo ""
            echo "   To trigger a production deployment, use:"
            echo "   gh workflow run deploy-production.yml --ref main -f confirm=\"DEPLOY TO PRODUCTION\""
            exit 1
          fi
          
          echo "✅ Deployment confirmed by ${{ github.actor }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOTE: Critical validations (lock files, migrations, smoke tests) run in PR CI
      # This workflow assumes all validation passed before merge to main
      # Infrastructure validation runs in CI/PR checks

      - name: Dependency audit
        run: |
          echo "🔐 Auditing production dependencies for vulnerabilities..."
          npm audit --audit-level=high --omit=dev || {
            echo "⚠️  High/Critical vulnerabilities found in production dependencies"
            echo "Review required before deployment"
            exit 1
          }
          echo "✅ No high/critical vulnerabilities in production dependencies"

      - name: Build validation
        run: |
          echo "🔨 Building backend..."
          npm run build -w backend
          echo "✅ Backend build successful"

      - name: Test backend
        run: |
          echo "🧪 Running backend tests..."
          npm run test:backend

      # Frontend is built on the server during deployment (not here)
      # The server build uses VITE_PASSWORD from /opt/app-monitor/shared/config/.env.production

      - name: Package deployment artifact
        id: package
        run: |
          # Create deployment package
          ARTIFACT_NAME="app-monitor-${GITHUB_SHA:0:7}"
          TARBALL_NAME="${ARTIFACT_NAME}.tar.gz"
          MANIFEST_NAME="${ARTIFACT_NAME}.manifest.json"
          
          # Create tarball with all necessary files
          # Note: tar may exit with 1 if files change during archiving (expected when creating in same dir)
          # Use -h to dereference symlinks (include actual files instead of links)
          tar -czf "$TARBALL_NAME" \
            -h \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=.pids \
            --exclude=current \
            --exclude=current.backup \
            --exclude=releases \
            --exclude='*.log' \
            . || [[ $? -eq 1 ]]
          
          # Calculate checksum
          SHA256=$(sha256sum "$TARBALL_NAME" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "tarball=$TARBALL_NAME" >> $GITHUB_OUTPUT
          echo "manifest=$MANIFEST_NAME" >> $GITHUB_OUTPUT
          
          # Create manifest
          cat > "$MANIFEST_NAME" <<EOF
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tarball": "$TARBALL_NAME",
            "sha256": "$SHA256"
          }
          EOF
          
          echo "✅ Created deployment package: $TARBALL_NAME ($SHA256)"

      - name: Upload deployment artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: app-monitor-deployment-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.manifest }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub deployment
        id: deploy
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: `Deploy ${context.sha.substring(0, 7)} by ${context.actor}`,
              payload: {
                workflow: {
                  run_id: context.runId,
                  run_number: context.runNumber
                },
                source: {
                  commit: context.sha,
                  ref: context.ref,
                  actor: context.actor
                },
                artifact: {
                  id: '${{ steps.upload.outputs.artifact-id }}',
                  name: 'app-monitor-deployment-${{ github.sha }}',
                  tarball: '${{ steps.package.outputs.tarball }}',
                  manifest: '${{ steps.package.outputs.manifest }}',
                  sha256: '${{ steps.package.outputs.sha256 }}'
                }
              }
            });
            
            core.setOutput('deployment_id', deployment.data.id);
            
            // Set initial status to queued
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'queued',
              description: 'Waiting for pull agent to process deployment',
              environment_url: 'https://app-monitor.yourdomain.com',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            
            console.log(`✅ Created deployment ${deployment.data.id}`);

      - name: Display deployment info
        run: |
          echo "🏭 PRODUCTION DEPLOYMENT CREATED"
          echo "================================"
          echo "Deployment ID: ${{ steps.deploy.outputs.deployment_id }}"
          echo "Artifact ID: ${{ steps.upload.outputs.artifact-id }}"
          echo "Commit: ${{ github.sha }}"
          echo "SHA256: ${{ steps.package.outputs.sha256 }}"
          echo ""
          echo "⏳ Pull agent will process this deployment within 2 minutes"
          echo "📊 Monitor status: journalctl -u app-monitor-deploy-agent.service -f"

  # Monitor deployment status
  monitor-deployment:
    name: Monitor Deployment
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    
    steps:
      - name: Wait for deployment
        uses: actions/github-script@v7
        timeout-minutes: 10
        with:
          script: |
            const deploymentId = '${{ needs.build-and-package.outputs.deployment-id }}';
            const maxWaitMinutes = 10;
            const checkIntervalSeconds = 15;
            const maxChecks = (maxWaitMinutes * 60) / checkIntervalSeconds;
            const stuckThresholdSeconds = 180; // 3 minutes - if no progress, likely stuck
            
            console.log(`⏳ Monitoring deployment ${deploymentId}...`);
            console.log(`Will check every ${checkIntervalSeconds}s for up to ${maxWaitMinutes} minutes`);
            console.log(`Stuck threshold: ${stuckThresholdSeconds}s without progress`);
            
            let seenInProgress = false;
            let lastStatusState = 'unknown';
            let lastStatusDescription = '';
            let statusUnchangedCount = 0;
            const maxStatusUnchanged = Math.ceil(stuckThresholdSeconds / checkIntervalSeconds);

            for (let i = 0; i < maxChecks; i++) {
              // Get more statuses to avoid missing failures due to pagination
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId,
                per_page: 10
              });

              if (statuses.data.length > 0) {
                const latestStatus = statuses.data[0];
                const state = latestStatus.state;
                const description = latestStatus.description || 'No description';
                const statusUpdated = latestStatus.updated_at;

                console.log(`[Check ${i + 1}/${maxChecks}] Status: ${state} - ${description}`);
                console.log(`  Last updated: ${statusUpdated}`);

                // Track if status is stuck (same state AND same description)
                if (state === lastStatusState && description === lastStatusDescription) {
                  statusUnchangedCount++;
                } else {
                  statusUnchangedCount = 0;
                  lastStatusState = state;
                  lastStatusDescription = description;
                }

                if (state === 'in_progress') {
                  seenInProgress = true;

                  // Check if stuck in progress for too long
                  if (statusUnchangedCount >= maxStatusUnchanged) {
                    const stuckTime = statusUnchangedCount * checkIntervalSeconds;
                    core.setFailed(
                      `❌ Deployment appears stuck in 'in_progress' state for ${stuckTime}s\n` +
                      `Last update: ${description}\n` +
                      `\n` +
                      `Possible causes:\n` +
                      `  - Deployment lock deadlock (process hung)\n` +
                      `  - Deploy agent crashed\n` +
                      `  - Network issues preventing status updates\n` +
                      `\n` +
                      `Troubleshooting:\n` +
                      `  1. Check agent logs: journalctl -u app-monitor-deploy-agent.service -n 100\n` +
                      `  2. Check for lock issues: /opt/app-monitor/scripts/deployment-lock-manager.sh check\n` +
                      `  3. Force cleanup if needed: /opt/app-monitor/scripts/deployment-lock-manager.sh cleanup`
                    );
                    return;
                  }
                }

                if (state === 'success') {
                  console.log('✅ Deployment completed successfully!');
                  return;
                } else if (state === 'failure' || state === 'error') {
                  core.setFailed(`❌ Deployment failed: ${description}\n\nCheck server logs: journalctl -u app-monitor-deploy-agent.service -n 100`);
                  return;
                }
              } else {
                // No statuses found - this is suspicious if we've seen in_progress before
                if (seenInProgress) {
                  console.log('⚠️  Warning: No deployment statuses found after seeing in_progress');
                  console.log('This might indicate the deployment failed but status update was lost');
                  statusUnchangedCount++;

                  // If we've seen in_progress but now have no statuses for too long, fail
                  if (statusUnchangedCount >= 4) { // 1 minute
                    core.setFailed(`❌ Deployment status disappeared after being in progress. Agent may have crashed.\n\nCheck server logs: journalctl -u app-monitor-deploy-agent.service -n 100`);
                    return;
                  }
                } else {
                  console.log('No deployment statuses yet, waiting...');
                }
              }
              
              if (i < maxChecks - 1) {
                await new Promise(resolve => setTimeout(resolve, checkIntervalSeconds * 1000));
              }
            }
            
            core.setFailed(`⏰ Deployment monitoring timed out after ${maxWaitMinutes} minutes. Check server logs: journalctl -u app-monitor-deploy-agent.service -n 100`);

      - name: Deployment complete
        if: success()
        run: |
          echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "Commit: ${{ github.sha }}"
          echo "Deployment ID: ${{ needs.build-and-package.outputs.deployment-id }}"
