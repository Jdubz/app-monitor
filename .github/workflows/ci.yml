name: App Monitor CI

on:
  pull_request:
    branches: [ main ]

jobs:
  # Install dependencies once and cache for all jobs
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

  # CRITICAL: Validate workspace lock files (prevents deployment failures)
  # This simulates the production deployment process to catch issues early
  validate-workspace-locks:
    name: Validate Workspace Lock Files
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Validate workspace lock files
        run: |
          echo "🔍 Validating workspace lock files (deployment simulation)..."
          chmod +x scripts/validate-workspace-locks.cjs
          node scripts/validate-workspace-locks.cjs

  # CRITICAL: Validate database migrations before merge
  validate-migrations:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration files
        run: |
          echo "🗄️ Validating database migration files..."
          chmod +x scripts/validate-migrations.sh
          ./scripts/validate-migrations.sh

  # CRITICAL: Smoke test deployment process before merge
  deployment-smoke-test:
    name: Deployment Smoke Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Run deployment smoke test
        run: |
          echo "🧪 Running deployment smoke test..."
          chmod +x scripts/production/smoke-test-deployment.sh
          ./scripts/production/smoke-test-deployment.sh

  # Backend linting - fast, no dependencies on tests
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Lint backend
        run: npm run lint -w backend

  # Backend unit tests - parallel with linting
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Test backend
        run: npm run test -w backend
        env:
          SKIP_HEAVY_DEV_BOT_TESTS: '1'

  # Backend integration tests - separate job for all integration tests
  backend-test-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Run all backend integration tests
        working-directory: backend
        run: npx vitest run --config vitest.config.ts tests/integration src/services/websocket.integration.test.ts --reporter verbose
        # Note: No SKIP_HEAVY_DEV_BOT_TESTS so all integration tests run

  # Frontend linting - parallel with backend
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Lint frontend
        run: npm run lint -w frontend

  # Frontend unit tests - parallel with backend
  frontend-test-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Test frontend (unit)
        run: npm run test -w frontend

  # Frontend integration tests - parallel with unit tests
  frontend-test-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Test frontend (integration)
        run: npm run test:integration -w frontend

  build:
    name: Build Backend and Frontend
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        env:
          VITE_PASSWORD: placeholder-password
          VITE_API_KEY: placeholder-api-key
        run: npm run build -w frontend

  validate-migrations:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    needs: install
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            shared/api-contracts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Run migration validation script
        run: ./scripts/validate-migrations.sh
