name: Dev-Bots Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dev-bots/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'dev-bots/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dev-bots
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: dev-bots/package.json
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Docker build test
        run: docker build -f docker/Dockerfile -t app-monitor-dev-bot .
