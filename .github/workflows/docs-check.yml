name: Documentation Check

on:
  pull_request:
    branches:
      - main

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check links in documentation
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/workflows/markdown-link-check-config.json'
          check-modified-files-only: 'no'
          base-branch: 'main'

      - name: Summary
        if: always()
        run: |
          echo "## Documentation Link Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ All documentation links are valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some documentation links are broken" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please fix broken links before merging." >> $GITHUB_STEP_SUMMARY
          fi
