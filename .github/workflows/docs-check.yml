name: Documentation Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '*.md'

jobs:
  check-documentation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for forbidden directories
        run: |
          if [ -d "docs/archive" ]; then
            echo "❌ ERROR: docs/archive/ directory exists"
            echo "Archives are forbidden. Delete completed/outdated docs."
            exit 1
          fi
          if [ -d "docs/analysis" ]; then
            echo "❌ ERROR: docs/analysis/ directory exists"
            echo "Analysis documents should be deleted after use."
            exit 1
          fi
          echo "✅ No forbidden directories found"

      - name: Check for test databases in docs
        run: |
          if find docs -name "*.db" -o -name "*.sqlite" | grep -q .; then
            echo "❌ ERROR: Database files found in docs/"
            find docs -name "*.db" -o -name "*.sqlite"
            echo "Database files should not be committed to documentation."
            exit 1
          fi
          echo "✅ No database files in docs"

      - name: Enforce sprawl prevention
        run: |
          ERRORS=0
          
          echo "📊 Documentation Sprawl Prevention Check"
          echo "=========================================="
          echo ""
          
          # 1. Check total document count (hard limit)
          TOTAL_DOCS=$(find docs -name "*.md" | wc -l)
          echo "Total documentation files: $TOTAL_DOCS"
          if [ "$TOTAL_DOCS" -gt 20 ]; then
            echo "❌ ERROR: Too many docs ($TOTAL_DOCS > 20 limit)"
            echo "Delete outdated/completed docs before adding new ones."
            ERRORS=1
          else
            echo "✅ Document count within limit ($TOTAL_DOCS/20)"
          fi
          echo ""
          
          # 2. Check for anti-patterns indicating doc hoarding
          echo "Checking for documentation anti-patterns..."
          ANTIPATTERNS=0
          
          if find docs -name "*COMPLETED*.md" -o -name "*archived*.md" -o -name "*old*.md" 2>/dev/null | grep -q .; then
            echo "❌ Found completed/archived/old documents:"
            find docs -name "*COMPLETED*.md" -o -name "*archived*.md" -o -name "*old*.md" 2>/dev/null
            echo "   DELETE these instead of keeping them."
            ANTIPATTERNS=1
            ERRORS=1
          fi
          
          if find docs -name "*-v2.md" -o -name "*-new.md" -o -name "*-draft.md" 2>/dev/null | grep -q .; then
            echo "⚠️  Found versioned/draft documents:"
            find docs -name "*-v2.md" -o -name "*-new.md" -o -name "*-draft.md" 2>/dev/null
            echo "   Consolidate or delete these."
            ANTIPATTERNS=1
          fi
          
          if [ "$ANTIPATTERNS" -eq 0 ]; then
            echo "✅ No documentation anti-patterns detected"
          fi
          echo ""
          
          # 3. Report by directory (for awareness)
          echo "Documentation distribution:"
          for dir in docs/*/; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -maxdepth 1 -name "*.md" | wc -l)
              DIRNAME=$(basename "$dir")
              echo "  $DIRNAME: $COUNT files"
            fi
          done
          echo ""
          
          if [ "$ERRORS" -eq 0 ]; then
            echo "✅ Sprawl prevention checks passed!"
          else
            echo "❌ Sprawl prevention checks failed!"
            echo ""
            echo "Philosophy: Documentation sprawl kills maintainability."
            echo "Action: Delete outdated docs. Don't archive. Don't hoard."
          fi
          
          exit $ERRORS

      - name: Check master-design-intent size
        run: |
          LINES=$(wc -l < docs/architecture/master-design-intent.md)
          if [ "$LINES" -gt 100 ]; then
            echo "❌ ERROR: master-design-intent.md is $LINES lines (max 100)"
            echo "This document should be extremely concise."
            exit 1
          fi
          echo "✅ master-design-intent.md size: $LINES lines (within 100 limit)"

      - name: Validate document structure
        run: |
          ERRORS=0
          
          # Required directories
          for dir in architecture guides plans technicalDesigns; do
            if [ ! -d "docs/$dir" ]; then
              echo "❌ ERROR: Missing required directory: docs/$dir"
              ERRORS=1
            fi
          done
          
          # Required files
          if [ ! -f "docs/architecture/master-design-intent.md" ]; then
            echo "❌ ERROR: Missing master-design-intent.md"
            ERRORS=1
          fi
          
          exit $ERRORS

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/workflows/markdown-link-check-config.json'
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          folder-path: 'docs'
          max-depth: -1

      - name: Summary
        if: success()
        run: |
          echo "✅ All documentation checks passed!"
          echo ""
          echo "Documentation is lean, focused, and sprawl-free."
