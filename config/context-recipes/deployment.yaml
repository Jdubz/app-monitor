profile: deployment
version: "1.0"
description: "Deployment guides, Docker configuration, production setup"
taskTypes: [implementation]
required: false

sizeLimit:
  maxBytes: 22000
  maxInlineBytes: 4500

investigationSteps:
  - "READ docs/guides/PRODUCTION_DEPLOYMENT.md for deployment procedures"
  - "CHECK backend/src/services/dockerConfig.ts for Docker settings"
  - "VERIFY deployment scripts in scripts/ directory"
  - "REVIEW Docker container configuration patterns"
  - "UNDERSTAND the ephemeral worker pattern for dev-bots"

constraints:
  - "MUST follow deployment procedures from PRODUCTION_DEPLOYMENT.md"
  - "MUST use existing Docker configuration patterns from dockerConfig.ts"
  - "MUST NOT modify production deployment scripts without review"
  - "MUST test Docker changes in development environment first"
  - "MUST follow existing volume mounting patterns (read-only for credentials)"
  - "MUST use ephemeral containers with AutoRemove: true"

sources:
  - type: markdown
    path: "docs/guides/PRODUCTION_DEPLOYMENT.md"
    transform: summarize
    
  - type: code
    path: "backend/src/services/dockerConfig.ts"
    transform: strip-comments
    
  - type: markdown
    path: "docs/plans/APP_MONITOR_PRODUCTION_SUPPORT_PLAN.md"
    extract:
      headings: ["Three-Root Architecture", "Deployment Model"]
    transform: summarize
    
  - type: code
    path: "backend/src/services/ephemeralWorker.service.ts"
    extract:
      sections: ["createWorker"]
    transform: strip-comments

outputs:
  format: markdown
  filename: "deployment.md"
  includeMetadata: true
