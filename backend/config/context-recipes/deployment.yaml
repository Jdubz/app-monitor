# Deployment Context Recipe
# Provides context for deployment-related tasks

profile: deployment
version: 1.0.0
description: Context bundle for deployment tasks including Docker configuration, scripts, and environment setup

taskTypes:
  - deployment

required: true

sizeLimit:
  maxBytes: 50000
  maxInlineBytes: 12000

constraints:
  - "Do not modify production environment variables without explicit approval"
  - "Always verify Docker image builds before deployment"
  - "Ensure database migrations are tested in staging first"
  - "Do not commit secrets or credentials to version control"
  - "Follow the deployment checklist in DEPLOYMENT.md"

investigationSteps:
  - "Review Docker configuration for security issues"
  - "Check package.json scripts for deployment commands"
  - "Verify environment variable requirements"
  - "Review recent deployment history and any failures"
  - "Check for pending database migrations"

sources:
  # Docker configuration
  - type: config
    path: Dockerfile
    transform: none
    optional: false

  - type: yaml
    path: docker-compose.yml
    transform: none
    optional: true

  - type: yaml
    path: docker-compose.prod.yml
    transform: none
    optional: true

  # Package configuration
  - type: json
    path: package.json
    extract:
      jsonPath: $.scripts
    transform: none
    optional: false

  # Deployment documentation
  - type: markdown
    path: docs/DEPLOYMENT.md
    extract:
      headings:
        - "Deployment Process"
        - "Environment Variables"
        - "Prerequisites"
        - "Troubleshooting"
    transform: bullet-list
    optional: true

  # Environment template
  - type: text
    path: .env.example
    transform: none
    optional: true

  # Database migrations
  - type: text
    path: migrations/
    transform: summarize
    optional: true

  # CI/CD configuration
  - type: yaml
    path: .github/workflows/deploy.yml
    transform: none
    optional: true

  # Infrastructure configuration
  - type: config
    path: config/deployment.json
    transform: none
    optional: true

outputs:
  format: markdown
  filename: deployment-context.md
  includeMetadata: true

ttl: 3600  # 1 hour cache
