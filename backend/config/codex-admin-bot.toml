# Codex Configuration for Admin Bot Sessions
# This config is automatically used when spawning Codex CLI for admin bot chat
#
# The admin bot has pre-configured access to the App Monitor MCP server
# which provides 24 tools for system management, planning, and troubleshooting.
#
# NOTE: This file is a template. The actual config is generated dynamically
# by AdminBotService with absolute paths substituted at runtime.

[mcp_servers.app-monitor]
type = "stdio"
command = "node"
# This path will be replaced with absolute path at runtime
args = ["--loader", "tsx", "{{MCP_START_PATH}}"]
startup_timeout_ms = 10000

# Environment variables for MCP server
[mcp_servers.app-monitor.env]
APP_MONITOR_MCP_USER_ROLE = "admin"
NODE_ENV = "production"
# Database path will be set at runtime
DATABASE_PATH = "{{DATABASE_PATH}}"

[features]
# MCP client features (stdio only, no remote servers needed)
# rmcp_client = false  # Not needed - using stdio only
