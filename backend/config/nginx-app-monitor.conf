# App Monitor - Production Configuration
# Serves frontend and proxies API requests to backend
#
# Installation:
#   sudo cp nginx-app-monitor.conf /etc/nginx/sites-available/app-monitor
#   sudo ln -s /etc/nginx/sites-available/app-monitor /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default  # Remove default site
#   sudo nginx -t                              # Test configuration
#   sudo systemctl reload nginx                # Apply changes

upstream app_monitor_backend {
    # This will be updated by deploy.sh to point to active backend port (5001 or 5002)
    server 127.0.0.1:5002;
}

server {
    # Listen on all network interfaces (accessible from other machines)
    listen 80;
    # Accept connections from any hostname (use your machine's IP or hostname)
    server_name _;

    # Root directory for frontend static files
    root /opt/app-monitor/current/frontend/dist;
    index index.html;

    # Frontend - serve static files with fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # SSE endpoint - Server-Sent Events require special handling
    location /api/sse/ {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Disable all buffering for SSE
        proxy_buffering off;
        proxy_cache off;

        # Disable chunked transfer encoding issues
        chunked_transfer_encoding on;

        # Keep connection alive for streaming
        proxy_set_header Connection '';

        # Long timeouts for persistent connections
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 86400s;

        # Disable response buffering in nginx
        proxy_request_buffering off;

        # Pass through SSE headers properly
        add_header X-Accel-Buffering no;
    }

    # Socket.IO endpoint - explicit WebSocket support
    location /socket.io/ {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific timeouts
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;

        # Disable buffering for real-time communication
        proxy_buffering off;
    }

    # API - proxy to backend
    location /api/ {
        proxy_pass http://app_monitor_backend;
        proxy_http_version 1.1;

        # WebSocket support for Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint (bypass proxy for nginx health)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
