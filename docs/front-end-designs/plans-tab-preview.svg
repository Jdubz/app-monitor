  <text x="310" y="368" fill="#6b7280" font-family="system-ui" font-size="12">Status</text>
  <text x="420" y="368" fill="#6b7280" font-family="system-ui" font-size="12">% Complete</text>
  <text x="520" y="368" fill="#6b7280" font-family="system-ui" font-size="12">Open blockers</text>

  <!-- Row 1 (selected) -->
  <rect x="72" y="382" width="608" height="56" rx="8" fill="#0b1120" stroke="#22c55e" />
  <text x="88" y="404" fill="#e5e7eb" font-family="system-ui" font-size="13">
