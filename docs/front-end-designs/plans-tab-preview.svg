  </text>
  <text x="760" y="420" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Tasks: 12 total · 7 completed · 3 running · 2 pending
  </text>
  <text x="760" y="438" fill="#e5e7eb" font-family="system-ui" font-size="11">
