  </text>
  <text x="760" y="456" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Chains: 3 active · 0 blocked · 0 escalated
  </text>

  <!-- Blockers -->
  <rect x="740" y="500" width="624" height="120" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="524" fill="#9ca3af" font-family="system-ui" font-size="12">
    Blockers (aggregated)
  </text>
  <text x="760" y="546" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • PR #124: CI checks failing · merge conflict on backend/schema.sql
  </text>
  <text x="760" y="564" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Task: "Review quarantine behavior" · chain-009 at depth limit
  </text>
  <text x="760" y="582" fill="#9ca3af" font-family="system-ui" font-size="11">
    • Scope boundaries enforced: dev-bots only · no host filesystem changes
  </text>

  <!-- Success criteria / scope -->
  <rect x="740" y="634" width="624" height="120" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="658" fill="#9ca3af" font-family="system-ui" font-size="12">
    Goals &amp; scope
  </text>
  <text x="760" y="680" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Success criteria: all plan-linked tasks completed, PR gates green, no quarantined chains
  </text>
  <text x="760" y="698" fill="#9ca3af" font-family="system-ui" font-size="11">
    • Scope boundaries: must not affect production DB schema; must not reintroduce log viewer UI
  </text>

  <!-- Actions -->
  <rect x="760" y="726" width="150" height="28" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="774" y="744" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Open plan markdown
  </text>
  <rect x="924" y="726" width="160" height="28" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="938" y="744" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Pause new tasks for plan
  </text>
</svg>

