  </text>
  <text x="420" y="404" fill="#e5e7eb" font-family="system-ui" font-size="12">
    68%
  </text>
  <text x="520" y="404" fill="#e5e7eb" font-family="system-ui" font-size="12">
    1 PR, 1 chain
  </text>

  <!-- Row 2 -->
  <rect x="72" y="444" width="608" height="56" rx="8" fill="#020617" stroke="#111827" />
  <text x="88" y="466" fill="#e5e7eb" font-family="system-ui" font-size="13">
    Dev-Bot Foundational Upgrades
  </text>
  <text x="88" y="482" fill="#9ca3af" font-family="system-ui" font-size="11">
    plan_type: refactor · priority: P1
  </text>
  <text x="310" y="466" fill="#f97316" font-family="system-ui" font-size="12">
    blocked
  </text>
  <text x="420" y="466" fill="#e5e7eb" font-family="system-ui" font-size="12">
    73%
  </text>
  <text x="520" y="466" fill="#e5e7eb" font-family="system-ui" font-size="12">
    2 PRs
  </text>

  <!-- Right pane: plan detail -->
  <rect x="720" y="284" width="664" height="556" rx="14" fill="#020617" stroke="#1f2937" />
  <text x="740" y="312" fill="#9ca3af" font-family="system-ui" font-size="12" letter-spacing="3">
