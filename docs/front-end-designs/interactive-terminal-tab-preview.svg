<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Interactive Terminal Tab - Dual Pane Overview</title>
  <desc id="desc">
    Wireframe preview of the Interactive Terminal tab showing a list of
    interactive sessions on the left and a focused terminal plus session
    metadata on the right.
  </desc>

  <!-- Background -->
  <rect x="0" y="0" width="1440" height="900" fill="#020617" />

  <!-- App header -->
  <rect x="40" y="32" width="1360" height="72" rx="16" fill="#020617" stroke="#1e293b" stroke-width="2" />
  <text x="72" y="78" fill="#e5e7eb" font-family="system-ui" font-size="22" font-weight="600">
    App Monitor · Interactive Sessions
  </text>

  <!-- Primary feature tabs -->
  <rect x="40" y="120" width="1360" height="44" rx="10" fill="#020617" stroke="#1e293b" />
  <g font-family="system-ui" font-size="13">
    <rect x="56" y="126" width="130" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="78" y="147" fill="#9ca3af">Dev-Bots</text>

    <rect x="200" y="126" width="130" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="220" y="147" fill="#9ca3af">PR Tracking</text>

    <rect x="344" y="126" width="150" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="364" y="147" fill="#9ca3af">Task Queue</text>

    <rect x="512" y="126" width="110" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="532" y="147" fill="#9ca3af">Plans</text>

    <rect x="640" y="126" width="170" height="32" rx="8" fill="#0f172a" stroke="#22c55e" />
    <text x="660" y="147" fill="#e5e7eb">Interactive Terminal</text>
  </g>

  <!-- Summary metrics -->
  <g>
    <rect x="40" y="176" width="430" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="60" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">ACTIVE SESSIONS</text>
    <text x="60" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      1 active · 3 recent
    </text>

    <rect x="490" y="176" width="430" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="510" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">IDLE TIMEOUT</text>
    <text x="510" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      300s · 42s remaining
    </text>

    <rect x="940" y="176" width="460" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="960" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">SAFETY</text>
    <text x="960" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      Scoped to app-monitor workspace
    </text>
  </g>

  <!-- Dual pane container -->
  <rect x="40" y="268" width="1360" height="588" rx="18" fill="#020617" stroke="#1f2937" />

  <!-- Left pane: sessions overview -->
  <rect x="56" y="284" width="640" height="556" rx="14" fill="#020617" stroke="#1f2937" />
  <text x="76" y="312" fill="#9ca3af" font-family="system-ui" font-size="12" letter-spacing="3">
    INTERACTIVE SESSIONS
  </text>
  <text x="76" y="336" fill="#e5e7eb" font-family="system-ui" font-size="18" font-weight="600">
    Session list &amp; history
  </text>

  <!-- New session button -->
  <rect x="76" y="348" width="160" height="28" rx="8" fill="#0f172a" stroke="#22c55e" />
  <text x="90" y="366" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Start new session
  </text>

  <!-- Header row -->
  <rect x="72" y="386" width="608" height="30" rx="6" fill="#020617" stroke="#111827" />
  <text x="88" y="406" fill="#6b7280" font-family="system-ui" font-size="12">Session</text>
  <text x="260" y="406" fill="#6b7280" font-family="system-ui" font-size="12">Owner</text>
  <text x="380" y="406" fill="#6b7280" font-family="system-ui" font-size="12">Model</text>
  <text x="520" y="406" fill="#6b7280" font-family="system-ui" font-size="12">Status</text>

  <!-- Row 1 (selected) -->
  <rect x="72" y="420" width="608" height="48" rx="8" fill="#0b1120" stroke="#22c55e" />
  <text x="88" y="442" fill="#e5e7eb" font-family="system-ui" font-size="12">
    session-2025-11-15-001
  </text>
  <text x="260" y="442" fill="#e5e7eb" font-family="system-ui" font-size="12">
    ops@example.com
  </text>
  <text x="380" y="442" fill="#9ca3af" font-family="system-ui" font-size="12">
    claude-3.5
  </text>
  <text x="520" y="442" fill="#22c55e" font-family="system-ui" font-size="12">
    active · 42s to idle
  </text>

  <!-- Row 2 -->
  <rect x="72" y="474" width="608" height="48" rx="8" fill="#020617" stroke="#111827" />
  <text x="88" y="496" fill="#e5e7eb" font-family="system-ui" font-size="12">
    session-2025-11-15-000
  </text>
  <text x="260" y="496" fill="#e5e7eb" font-family="system-ui" font-size="12">
    dev@example.com
  </text>
  <text x="380" y="496" fill="#9ca3af" font-family="system-ui" font-size="12">
    gpt-4.1
  </text>
  <text x="520" y="496" fill="#9ca3af" font-family="system-ui" font-size="12">
    completed
  </text>

  <!-- Right pane: terminal and metadata -->
  <rect x="720" y="284" width="664" height="556" rx="14" fill="#020617" stroke="#1f2937" />
  <text x="740" y="312" fill="#9ca3af" font-family="system-ui" font-size="12" letter-spacing="3">
    TERMINAL
  </text>
  <text x="740" y="336" fill="#e5e7eb" font-family="system-ui" font-size="18" font-weight="600">
    session-2025-11-15-001
  </text>
  <text x="740" y="358" fill="#9ca3af" font-family="system-ui" font-size="12">
    Connected · claude-3.5 · owner: ops@example.com
  </text>

  <!-- Terminal window -->
  <rect x="740" y="374" width="624" height="260" rx="10" fill="#020617" stroke="#1f2937" />
  <rect x="748" y="382" width="608" height="18" rx="6" fill="#020617" />
  <circle cx="758" cy="391" r="4" fill="#ef4444" />
  <circle cx="770" cy="391" r="4" fill="#f59e0b" />
  <circle cx="782" cy="391" r="4" fill="#22c55e" />
  <text x="798" y="395" fill="#6b7280" font-family="system-ui" font-size="11">
    Interactive shell · app-monitor workspace
  </text>
  <text x="756" y="414" fill="#22c55e" font-family="ui-monospace, SFMono-Regular" font-size="11">
    ops@app-monitor:~$ npm run test:backend
  </text>
  <text x="756" y="432" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular" font-size="11">
    &gt; running 543 tests with sqlite task queue…
  </text>
  <text x="756" y="450" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular" font-size="11">
    ✅ taskQueue.service › should respect chain limits
  </text>

  <!-- Command input -->
  <rect x="740" y="646" width="624" height="60" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="756" y="670" fill="#9ca3af" font-family="system-ui" font-size="12">
    Send command
  </text>
  <rect x="756" y="678" width="420" height="28" rx="6" fill="#020617" stroke="#111827" />
  <text x="766" y="697" fill="#6b7280" font-family="ui-monospace, SFMono-Regular" font-size="11">
    e.g. npm run test:frontend
  </text>
  <rect x="1186" y="678" width="78" height="28" rx="6" fill="#0f172a" stroke="#22c55e" />
  <text x="1204" y="697" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Send
  </text>

  <!-- Session metadata -->
  <rect x="740" y="716" width="624" height="108" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="740" fill="#9ca3af" font-family="system-ui" font-size="12">
    Session metadata
  </text>
  <text x="760" y="762" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Started: 2025-11-15 21:04 · Idle timeout: 300s · Idle in: 42s
  </text>
  <text x="760" y="780" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Last heartbeat: 21:06:18 (18s ago)
  </text>
  <text x="760" y="798" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Work target: app-monitor · Environment: production
  </text>
</svg>

