<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PR Tracking Tab - Dual Pane Overview</title>
  <desc id="desc">
    Wireframe preview of the PR Tracking tab showing an overview of PR chains
    on the left and detailed merge gate and chain information on the right,
    optimized for high-signal intervention.
  </desc>

  <!-- Background -->
  <rect x="0" y="0" width="1440" height="900" fill="#020617" />

  <!-- App header -->
  <rect x="40" y="32" width="1360" height="72" rx="16" fill="#020617" stroke="#1e293b" stroke-width="2" />
  <text x="72" y="78" fill="#e5e7eb" font-family="system-ui, -apple-system, BlinkMacSystemFont" font-size="22" font-weight="600">
    App Monitor · PR Control
  </text>

  <!-- Primary feature tabs -->
  <rect x="40" y="120" width="1360" height="44" rx="10" fill="#020617" stroke="#1e293b" />
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont" font-size="13">
    <rect x="56" y="126" width="130" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="78" y="147" fill="#9ca3af">Dev-Bots</text>

    <rect x="200" y="126" width="130" height="32" rx="8" fill="#0f172a" stroke="#22c55e" />
    <text x="220" y="147" fill="#e5e7eb">PR Tracking</text>

    <rect x="344" y="126" width="150" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="364" y="147" fill="#9ca3af">Task Queue</text>

    <rect x="512" y="126" width="110" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="532" y="147" fill="#9ca3af">Plans</text>

    <rect x="640" y="126" width="170" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="660" y="147" fill="#9ca3af">Interactive Terminal</text>
  </g>

  <!-- Summary metrics -->
  <g>
    <rect x="40" y="176" width="430" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="60" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">OPEN PRS</text>
    <text x="60" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      18 open · 5 blocked
    </text>

    <rect x="490" y="176" width="430" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="510" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">AUTO-MERGE READY</text>
    <text x="510" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      4 PRs · 0 pending approvals
    </text>

    <rect x="940" y="176" width="460" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="960" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">ESCALATIONS</text>
    <text x="960" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      2 chains at depth limit
    </text>
  </g>

  <!-- Dual pane container -->
  <rect x="40" y="268" width="1360" height="588" rx="18" fill="#020617" stroke="#1f2937" />

  <!-- Left pane: PR chains overview -->
  <rect x="56" y="284" width="640" height="556" rx="14" fill="#020617" stroke="#1f2937" />
  <text x="76" y="312" fill="#9ca3af" font-family="system-ui" font-size="12" letter-spacing="3">
    PR CHAINS
  </text>
  <text x="76" y="336" fill="#e5e7eb" font-family="system-ui" font-size="18" font-weight="600">
    Chain-aware PR overview
  </text>

  <!-- Filters -->
  <rect x="72" y="348" width="608" height="32" rx="8" fill="#020617" stroke="#111827" />
  <rect x="82" y="354" width="80" height="20" rx="999" fill="#0f172a" stroke="#22c55e" />
  <text x="96" y="368" fill="#e5e7eb" font-family="system-ui" font-size="11">All</text>
  <rect x="170" y="354" width="100" height="20" rx="999" fill="#020617" stroke="#111827" />
  <text x="188" y="368" fill="#f97316" font-family="system-ui" font-size="11">Blocked</text>
  <rect x="280" y="354" width="110" height="20" rx="999" fill="#020617" stroke="#111827" />
  <text x="298" y="368" fill="#e5e7eb" font-family="system-ui" font-size="11">Human review</text>

  <!-- Header row -->
  <rect x="72" y="386" width="608" height="30" rx="6" fill="#020617" stroke="#111827" />
  <text x="88" y="406" fill="#6b7280" font-family="system-ui" font-size="12">PR</text>
  <text x="190" y="406" fill="#6b7280" font-family="system-ui" font-size="12">Branch</text>
  <text x="330" y="406" fill="#6b7280" font-family="system-ui" font-size="12">Status</text>
  <text x="470" y="406" fill="#6b7280" font-family="system-ui" font-size="12">Blocked on</text>

  <!-- Row 1 (selected) -->
  <rect x="72" y="420" width="608" height="48" rx="8" fill="#0b1120" stroke="#22c55e" />
  <circle cx="88" cy="444" r="6" fill="#22c55e" />
  <text x="104" y="448" fill="#e5e7eb" font-family="system-ui" font-size="12">
    #128 · context-v3-plans
  </text>
  <text x="190" y="448" fill="#9ca3af" font-family="system-ui" font-size="12">
    feature/context-v3-plans
  </text>
  <text x="330" y="448" fill="#22c55e" font-family="system-ui" font-size="12">
    healthy · gates 6/8
  </text>
  <text x="470" y="448" fill="#9ca3af" font-family="system-ui" font-size="12">
    Copilot review pending
  </text>

  <!-- Row 2 -->
  <rect x="72" y="474" width="608" height="48" rx="8" fill="#020617" stroke="#111827" />
  <circle cx="88" cy="498" r="6" fill="#f97316" />
  <text x="104" y="502" fill="#e5e7eb" font-family="system-ui" font-size="12">
    #124 · plans-db-migration
  </text>
  <text x="190" y="502" fill="#9ca3af" font-family="system-ui" font-size="12">
    feature/plans-db
  </text>
  <text x="330" y="502" fill="#f97316" font-family="system-ui" font-size="12">
    blocked
  </text>
  <text x="470" y="502" fill="#e5e7eb" font-family="system-ui" font-size="12">
    merge conflicts · depth 3/4
  </text>

  <!-- Row 3 -->
  <rect x="72" y="528" width="608" height="48" rx="8" fill="#020617" stroke="#111827" />
  <circle cx="88" cy="552" r="6" fill="#ef4444" />
  <text x="104" y="556" fill="#e5e7eb" font-family="system-ui" font-size="12">
    #119 · pr-resilience
  </text>
  <text x="190" y="556" fill="#9ca3af" font-family="system-ui" font-size="12">
    feature/pr-resilience
  </text>
  <text x="330" y="556" fill="#ef4444" font-family="system-ui" font-size="12">
    escalated
  </text>
  <text x="470" y="556" fill="#e5e7eb" font-family="system-ui" font-size="12">
    automated retries exhausted
  </text>

  <!-- Right pane: PR detail -->
  <rect x="720" y="284" width="664" height="556" rx="14" fill="#020617" stroke="#1f2937" />
  <text x="740" y="312" fill="#9ca3af" font-family="system-ui" font-size="12" letter-spacing="3">
    PR DETAIL · CHAIN AWARE
  </text>
  <text x="740" y="336" fill="#e5e7eb" font-family="system-ui" font-size="18" font-weight="600">
    #124 · plans-db-migration
  </text>
  <text x="740" y="358" fill="#9ca3af" font-family="system-ui" font-size="12">
    feature/plans-db → main · linked chain: chain-011
  </text>

  <!-- Merge gate status -->
  <rect x="740" y="374" width="624" height="136" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="398" fill="#9ca3af" font-family="system-ui" font-size="12">
    Merge gates (8)
  </text>
  <!-- Gate chips -->
  <g font-family="system-ui" font-size="11">
    <rect x="760" y="414" width="160" height="24" rx="999" fill="#064e3b" />
    <text x="772" y="430" fill="#bbf7d0">Base branch updated</text>
    <rect x="932" y="414" width="160" height="24" rx="999" fill="#064e3b" />
    <text x="944" y="430" fill="#bbf7d0">No merge conflicts</text>
    <rect x="1104" y="414" width="160" height="24" rx="999" fill="#b91c1c" />
    <text x="1116" y="430" fill="#fee2e2">CI checks passing</text>

    <rect x="760" y="446" width="190" height="24" rx="999" fill="#0f172a" stroke="#4b5563" />
    <text x="772" y="462" fill="#e5e7eb">Copilot review complete</text>
    <rect x="962" y="446" width="180" height="24" rx="999" fill="#0f172a" stroke="#4b5563" />
    <text x="974" y="462" fill="#e5e7eb">Task verification passed</text>
  </g>

  <!-- Chain timeline -->
  <rect x="740" y="524" width="624" height="136" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="548" fill="#9ca3af" font-family="system-ui" font-size="12">
    Chain timeline
  </text>
  <line x1="780" y1="566" x2="1320" y2="566" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="800" cy="566" r="6" fill="#22c55e" />
  <text x="816" y="570" fill="#e5e7eb" font-family="system-ui" font-size="11">
    Implementation: completed
  </text>
  <circle cx="1000" cy="566" r="6" fill="#22c55e" />
  <text x="1016" y="570" fill="#e5e7eb" font-family="system-ui" font-size="11">
    Review: completed
  </text>
  <circle cx="1200" cy="566" r="6" fill="#f97316" />
  <text x="1216" y="570" fill="#fbbf24" font-family="system-ui" font-size="11">
    Fix: in progress (attempt 3/4)
  </text>

  <!-- Intervention actions -->
  <rect x="740" y="676" width="624" height="84" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="700" fill="#9ca3af" font-family="system-ui" font-size="12">
    Manual overrides (chain-aware)
  </text>
  <rect x="760" y="712" width="170" height="32" rx="8" fill="#b91c1c" />
  <text x="774" y="732" fill="#fef2f2" font-family="system-ui" font-size="12">
    Escalate to human
  </text>
  <rect x="944" y="712" width="170" height="32" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="958" y="732" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Re-run failed checks
  </text>
  <rect x="1128" y="712" width="136" height="32" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="1142" y="732" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Pause auto-merge
  </text>
</svg>

