  </text>

  <!-- Session summary -->
  <rect x="740" y="374" width="624" height="120" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="398" fill="#9ca3af" font-family="system-ui" font-size="12">
    Last automation attempt
  </text>
  <text x="760" y="418" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Status: failed · Exit code 1 · Duration 65s · Attempt 2/4
  </text>
  <text x="760" y="436" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Error: SQLite migration conflict · see session_summary.json
  </text>
  <text x="760" y="454" fill="#9ca3af" font-family="system-ui" font-size="11">
    • Work target: app-monitor · Environment: production
  </text>

  <!-- Task context & artifacts -->
  <rect x="740" y="506" width="624" height="148" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="530" fill="#9ca3af" font-family="system-ui" font-size="12">
    Context &amp; artifacts
  </text>
  <text x="760" y="552" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Linked PR: #124 plans-db-migration
  </text>
  <text x="760" y="570" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Artifacts: stdout.log · stderr.log · session_summary.json
  </text>
  <text x="760" y="588" fill="#e5e7eb" font-family="system-ui" font-size="11">
    • Diagnostics: git status · token usage · env snapshot
  </text>

  <!-- Interventions -->
  <rect x="740" y="670" width="624" height="80" rx="10" fill="#020617" stroke="#1f2937" />
  <text x="760" y="694" fill="#9ca3af" font-family="system-ui" font-size="12">
    Interventions
  </text>
  <rect x="760" y="706" width="150" height="32" rx="8" fill="#b91c1c" />
  <text x="774" y="726" fill="#fef2f2" font-family="system-ui" font-size="12">
    Quarantine chain
  </text>
  <rect x="926" y="706" width="170" height="32" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="940" y="726" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Retry task now
  </text>
  <rect x="1112" y="706" width="152" height="32" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="1126" y="726" fill="#e5e7eb" font-family="system-ui" font-size="12">
