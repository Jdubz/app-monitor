<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Task Queue Tab - Dual Pane Overview</title>
  <desc id="desc">
    Wireframe preview of the Task Queue tab showing a chain-aware queue
    overview on the left and selected task plus session summary details
    on the right, optimized for intervention.
  </desc>

  <!-- Background -->
  <rect x="0" y="0" width="1440" height="900" fill="#020617" />

  <!-- App header -->
  <rect x="40" y="32" width="1360" height="72" rx="16" fill="#020617" stroke="#1e293b" stroke-width="2" />
  <text x="72" y="78" fill="#e5e7eb" font-family="system-ui" font-size="22" font-weight="600">
    App Monitor · Task Queue
  </text>

  <!-- Primary feature tabs -->
  <rect x="40" y="120" width="1360" height="44" rx="10" fill="#020617" stroke="#1e293b" />
  <g font-family="system-ui" font-size="13">
    <rect x="56" y="126" width="130" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="78" y="147" fill="#9ca3af">Dev-Bots</text>

    <rect x="200" y="126" width="130" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="220" y="147" fill="#9ca3af">PR Tracking</text>

    <rect x="344" y="126" width="150" height="32" rx="8" fill="#0f172a" stroke="#22c55e" />
    <text x="364" y="147" fill="#e5e7eb">Task Queue</text>

    <rect x="512" y="126" width="110" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="532" y="147" fill="#9ca3af">Plans</text>

    <rect x="640" y="126" width="170" height="32" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="660" y="147" fill="#9ca3af">Interactive Terminal</text>
  </g>

  <!-- Summary metrics -->
  <g>
    <rect x="40" y="176" width="430" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="60" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">QUEUE DEPTH</text>
    <text x="60" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      14 pending · 3 running
    </text>

    <rect x="490" y="176" width="430" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="510" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">OLDEST TASK</text>
    <text x="510" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      47m · chain-009
    </text>

    <rect x="940" y="176" width="460" height="76" rx="14" fill="#020617" stroke="#1f2937" />
    <text x="960" y="202" fill="#6b7280" font-family="system-ui" font-size="11" letter-spacing="3">QUARANTINE</text>
    <text x="960" y="226" fill="#e5e7eb" font-family="system-ui" font-size="20" font-weight="600">
      1 chain quarantined
    </text>
  </g>

  <!-- Dual pane container -->
  <rect x="40" y="268" width="1360" height="588" rx="18" fill="#020617" stroke="#1f2937" />

  <!-- Left pane: queue overview -->
  <rect x="56" y="284" width="640" height="556" rx="14" fill="#020617" stroke="#1f2937" />
  <text x="76" y="312" fill="#9ca3af" font-family="system-ui" font-size="12" letter-spacing="3">
    TASK QUEUE
  </text>
  <text x="76" y="336" fill="#e5e7eb" font-family="system-ui" font-size="18" font-weight="600">
