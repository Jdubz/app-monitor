  </text>

  <!-- Header row -->
  <rect x="72" y="348" width="608" height="30" rx="6" fill="#020617" stroke="#111827" />
  <text x="88" y="368" fill="#6b7280" font-family="system-ui" font-size="12">Task</text>
  <text x="260" y="368" fill="#6b7280" font-family="system-ui" font-size="12">Type</text>
  <text x="340" y="368" fill="#6b7280" font-family="system-ui" font-size="12">Chain</text>
  <text x="470" y="368" fill="#6b7280" font-family="system-ui" font-size="12">Age</text>

  <!-- Row 1 (selected) -->
  <rect x="72" y="382" width="608" height="48" rx="8" fill="#0b1120" stroke="#22c55e" />
  <circle cx="88" cy="406" r="6" fill="#22c55e" />
  <text x="104" y="410" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Implement plans API
  </text>
  <text x="260" y="410" fill="#9ca3af" font-family="system-ui" font-size="12">
    implementation
  </text>
  <text x="340" y="410" fill="#9ca3af" font-family="system-ui" font-size="12">
    chain-011
  </text>
  <text x="470" y="410" fill="#9ca3af" font-family="system-ui" font-size="12">
    12m
  </text>

  <!-- Row 2 -->
  <rect x="72" y="436" width="608" height="48" rx="8" fill="#020617" stroke="#111827" />
  <circle cx="88" cy="460" r="6" fill="#f97316" />
  <text x="104" y="464" fill="#e5e7eb" font-family="system-ui" font-size="12">
    Review quarantine behavior
  </text>
  <text x="260" y="464" fill="#9ca3af" font-family="system-ui" font-size="12">
    review
  </text>
  <text x="340" y="464" fill="#9ca3af" font-family="system-ui" font-size="12">
    chain-009
  </text>
  <text x="470" y="464" fill="#9ca3af" font-family="system-ui" font-size="12">
    47m
  </text>

  <!-- Queue controls -->
  <rect x="72" y="498" width="608" height="60" rx="10" fill="#020617" stroke="#111827" />
  <text x="88" y="520" fill="#9ca3af" font-family="system-ui" font-size="12">
    Queue controls
  </text>
  <rect x="88" y="532" width="120" height="24" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="102" y="548" fill="#e5e7eb" font-family="system-ui" font-size="11">
    Pause queue
  </text>
  <rect x="218" y="532" width="160" height="24" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="232" y="548" fill="#e5e7eb" font-family="system-ui" font-size="11">
    Clear implementation tasks
  </text>
  <rect x="388" y="532" width="190" height="24" rx="8" fill="#0f172a" stroke="#4b5563" />
  <text x="402" y="548" fill="#e5e7eb" font-family="system-ui" font-size="11">
