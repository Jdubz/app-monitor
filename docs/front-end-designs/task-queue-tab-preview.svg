  </text>
  <text x="740" y="336" fill="#e5e7eb" font-family="system-ui" font-size="18" font-weight="600">
    Implement plans API
  </text>
  <text x="740" y="358" fill="#9ca3af" font-family="system-ui" font-size="12">
