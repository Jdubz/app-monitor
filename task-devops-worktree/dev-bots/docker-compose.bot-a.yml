version: '3.8'

services:
  bot-a:
    container_name: dev-bot-a
    image: claude-worker:latest
    build:
      context: ../../
      dockerfile: app-monitor/dev-bots/docker/Dockerfile

    # Mount the entire bot-a volume as the workspace
    volumes:
      - ./volumes/bot-a:/workspace:rw
      - bot-a-logs:/workspace/logs
      - bot-a-data:/workspace/.claude
      - bot-a-npm-cache:/home/worker/.npm-global
      - bot-a-python-cache:/home/worker/.cache

    working_dir: /workspace

    environment:
      - BOT_ID=bot-a
      - NODE_ENV=development
      - WORKSPACE_ROOT=/workspace
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    # Read env from the bot's volume
    env_file:
      - ./volumes/bot-a/.env

    # Keep container running
    command: /bin/bash -c "tail -f /dev/null"

    # Network configuration
    networks:
      - dev-bots-network

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

    # Health check
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace/job-finder-BE"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Restart policy
    restart: unless-stopped

volumes:
  bot-a-logs:
    driver: local
  bot-a-data:
    driver: local
  bot-a-npm-cache:
    driver: local
  bot-a-python-cache:
    driver: local

networks:
  dev-bots-network:
    name: dev-bots-network
    driver: bridge
